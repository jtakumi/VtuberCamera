plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id("com.google.gms.google-services")
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.example.vtubercamera'
    compileSdk 36
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.example.vtubercamera"
        minSdk 25
        targetSdk 36
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }
    viewBinding {
        enabled = true
    }

    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // リリース用の署名設定（開発時はdebugと同じ設定を使用）
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            debuggable false
            jniDebuggable false
            zipAlignEnabled true
        }
        debug {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding = true
        compose = true
        buildConfig = true
    }
    
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        freeCompilerArgs.add("-XXLanguage:+PropertyParamAnnotationDefaultTargetMode")
    }
}

afterEvaluate {
    tasks.matching { it.name == "hiltJavaCompileDebug" }.configureEach { task ->
        def config = configurations.findByName("debugCompileClasspath")
        if (config != null) {
            task.classpath += config
        }
    }
    tasks.matching { it.name == "hiltJavaCompileRelease" }.configureEach { task ->
        def config = configurations.findByName("releaseCompileClasspath")
        if (config != null) {
            task.classpath += config
        }
    }
}

dependencies {
    implementation 'androidx.lifecycle:lifecycle-viewmodel-android:2.10.0'
    implementation 'androidx.wear.compose:compose-material3:1.5.6'
    def camerax_version = "1.5.2"
    def compose_version = "1.7.8"

    // Core libraries（Android 15対応）
    implementation 'androidx.core:core-ktx:1.17.0'  // 更新
    implementation 'androidx.appcompat:appcompat:1.7.1'  // 更新
    implementation 'com.google.android.material:material:1.13.0'  // 更新

    // Support libraries
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    //Lifecycle
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.6'

    // Compose
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.material:material:$compose_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation "androidx.compose.material3:material3:1.4.0"
    implementation "androidx.compose.material3:material3-window-size-class:1.4.0"
    implementation "androidx.compose.material:material-icons-core:$compose_version"
    implementation "androidx.compose.material:material-icons-extended:$compose_version"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    
    // Coil
    implementation "io.coil-kt:coil-compose:2.7.0"
    
    // CameraX
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"
    
    // Hilt

    implementation 'com.google.dagger:hilt-android:2.59.1'
    ksp 'com.google.dagger:hilt-compiler:2.59.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'
    
    // ARCore
    implementation 'com.google.ar:core:1.52.0'

    // Filament 3D Rendering Engine
    def filament_version = "1.68.2"
    implementation "com.google.android.filament:filament-android:${filament_version}"
    implementation "com.google.android.filament:filament-utils-android:${filament_version}"
    implementation "com.google.android.filament:gltfio-android:${filament_version}"
    
    // VRM Support (using alternative VRM libraries)
    // Note: VRM support will be implemented using custom parsers with GLTF base
    // implementation 'io.github.ux-builder:vrm4j:1.0.0'  // Commented out due to availability
    
    // Additional math and 3D utilities
    implementation 'org.joml:joml:1.10.8'  // Java OpenGL Math Library
    
    // JSON parsing for VRM metadata
    implementation 'com.google.code.gson:gson:2.13.2'
    
    // Unit Testing - 基本的なテストのみ
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'com.google.dagger:hilt-android-testing:2.59.1'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.1.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    // Add missing MockK dependency for tests that use io.mockk.*
    testImplementation 'io.mockk:mockk:1.14.7'

    kspTest 'com.google.dagger:hilt-compiler:2.59.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.59.1'
    kspAndroidTest 'com.google.dagger:hilt-compiler:2.59.1'
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation "org.jetbrains.kotlin:kotlin-test:2.2.20"
}

