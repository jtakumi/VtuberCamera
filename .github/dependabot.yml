version: 2
updates:
  # Gradle依存関係の更新
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"

    # 依存関係のグループ化（関連するライブラリをまとめて更新）
    groups:
      # AndroidXライブラリ群
      androidx:
        patterns:
          - "androidx.*"
        exclude-patterns:
          - "androidx.compose.*"  # Composeは別グループで管理
          - "androidx.camera:*"   # CameraXは別グループで管理
          - "androidx.navigation:*" # Navigationは別グループで管理

      # Compose関連ライブラリ群
      compose:
        patterns:
          - "androidx.compose.*"
          - "*compose*"

      # CameraX関連ライブラリ群（VtuberCameraの中核機能）
      camerax:
        patterns:
          - "androidx.camera:*"
          - "*camera*"

      # Navigation関連ライブラリ群
      navigation:
        patterns:
          - "androidx.navigation:*"

      # Kotlin関連ライブラリ群
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "*kotlin*"
        exclude-patterns:
          - "androidx.*"  # AndroidXのKotlin関連は別グループ

      # Material Design関連
      material:
        patterns:
          - "com.google.android.material:*"
          - "*material*"

      # Testing関連ライブラリ
      testing:
        patterns:
          - "*test*"
          - "*mockito*"
          - "*junit*"
          - "*espresso*"

      # Network関連ライブラリ
      network:
        patterns:
          - "*retrofit*"
          - "*okhttp*"
          - "*gson*"
          - "*moshi*"

      # Firebase関連ライブラリ
      firebase:
        patterns:
          - "com.google.firebase:*"
          - "*firebase*"

    # 無視する更新（慎重に扱いたいもの）
    ignore:
      # Android Gradle Pluginのメジャーバージョンアップは手動で確認
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]

      # Kotlin Compiler Extensionのバージョンは慎重に扱う
      - dependency-name: "androidx.compose.compiler:compiler"
        update-types: ["version-update:semver-major"]

      # minSdkやtargetSdkに影響する可能性があるもの
      - dependency-name: "androidx.core:core-ktx"
        update-types: ["version-update:semver-major"]

      # CameraXのメジャーバージョンは慎重に（VtuberCameraの核心機能）
      - dependency-name: "androidx.camera:*"
        update-types: ["version-update:semver-major"]

    # プルリクエストの設定
    open-pull-requests-limit: 8

    # ラベルとアサイン
    labels:
      - "dependencies"
      - "android"
      - "vtuberCamera"
      - "auto-update"
    assignees:
      - "jtakumi"  # GitHubユーザー名
    reviewers:
      - "jtakumi"  # レビュワーも設定

    # コミットメッセージのカスタマイズ
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"

    # プルリクエストのテンプレート（bodyに含まれる情報）
    pull-request-branch-name:
      separator: "-"



  # GitHub Actionsの更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Tokyo"

    labels:
      - "github-actions"
      - "ci-cd"
      - "auto-update"
    assignees:
      - "jtakumi"  # GitHubユーザー名
    reviewers:
      - "jtakumi"

    open-pull-requests-limit: 3

    commit-message:
      prefix: "ci"
      include: "scope"

    # GitHub Actionsも自動マージの対象から除外したい場合
    ignore:
      - update-types: ["version-update:semver-major"]
