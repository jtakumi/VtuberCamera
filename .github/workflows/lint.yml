name: Android Lint Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: write  # ← review コメント権限に必須

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug || true   # 失敗しても後続が動くように

      - name: Install reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version:  v0.17.7 

      - name: Report lint results with reviewdog
        if: always()  # lint が失敗しても実行
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog -f=android-lint \
            -name="Android Lint" \
            -reporter=github-pr-review \
            -level=warning \
            -fail-on-error=false \
            < app/build/reports/lint-results-debug.xml
