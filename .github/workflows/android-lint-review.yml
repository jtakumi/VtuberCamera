name: Android Lint Review

on:
  pull_request:
    branches: [ main, dev, feature/* ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Read Java version from gradle.properties
      id: java-version
      run: |
        JAVA_VERSION=$(grep -E '^java\.version=' gradle.properties | cut -d'=' -f2 | tr -d ' ')
        if [ -z "$JAVA_VERSION" ]; then
          # フォールバック：別の記法もチェック
          JAVA_VERSION=$(grep -E '^javaVersion=' gradle.properties | cut -d'=' -f2 | tr -d ' ')
        fi
        # デフォルト値を設定
        if [ -z "$JAVA_VERSION" ]; then
          JAVA_VERSION=17
        fi
        echo "version=$JAVA_VERSION" >> $GITHUB_OUTPUT
        echo "Using Java version: $JAVA_VERSION"
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ steps.java-version.outputs.version }}
        distribution: 'adopt'
    
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Run Android Lint
      run: ./gradlew lintDebug
      continue-on-error: true
    
    - name: Upload lint results to ReviewDog
      uses: reviewdog/action-android-lint@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        android_lint_file: "app/build/reports/lint-results-debug.xml"
        level: warning
        reporter: github-pr-review